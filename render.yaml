services:
  - type: web
    name: fastcarmeta-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL            # Neon PostgreSQL bağlantı adresi (Render panelinden girilir)
        sync: false
